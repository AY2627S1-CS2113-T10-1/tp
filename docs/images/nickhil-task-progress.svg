-size="15" lengthAdjust="spacing" textLength="383.5693" x="540.6445" y="1045.9229">The aggregate returns a new Snapshot for changed work.</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="392.6733" x="540.6445" y="1064.79">TaskService never saves, publishes, reads time or replans.</text><text fill="#000000" font-family="sans-serif" font-size="15" lengthAdjust="spacing" textLength="383.562" x="540.6445" y="1083.6572">Rendering, file mechanics and later planning are external.</text><!--SRC=[dLPDRnit4BtlhnWaA28Nac87SGhBQ00ZiG4V4XIMaHxg7YZkQ9SGTxWbkPQTNzyPxgTiruSU3AsNy_7cpUFCleFlHkzAOq4xYjviccWSmVM75IYe6uyGC0H-jQYzApm_WrQKcrn5d0Evo6OXEgyAXEWL1QKbm38BEqErygg2ZTAxmhk6yY_EEW_xqaISd8TIvMvlg82jic5wakDMDJPUCRBlga9OS_mrUhDzsMPjVYASd4v3upyDaiPlZ9iHNbXJ46YaY7vYTU6zsxVOtdxyxVJqqrbMcXnXwrpSk8SiOxDejAaLHNYJcr2hg4lqA_ZYgehP-3gykYDyuE2ax0g-Ak-Hte0ACFh0swkJgzEhiyEOKOLTMC4j_t1zzqRZ7NLzIVxf_D0bkCPhNC6QL1rA5wUPBprXYCcpDHkoPjmn17VFG4PCyou-m3NLJGGJG5cFAdy4JXambq1TgSiRrCxdBT8aZ2NxNJweghQCvlO4IZO-EmQFbJB4NJtl5GIVJa15-73w2sYFkOc1coNUjoNsE3a3vxQ03oP4aOGaWdjb6mnTI6X8bueAp9SPihbKb4q8Ndnkou4LEmZM3kSVdNvdRQgswEjy3fMX9cAOGurUj76KYORlMU0TByeo9yGWJ3xKqZa1QwPpOtrnBT0bNp2C2QWLn9955k27H55oHIuVDDRoa26h7Wx36sd4DDnOLEu8uNUO6KOAivbrL1mDS7xjqS1xE3a-FdevHClBdyxldf4XqV_3QsiezVs9pnFhhf6hzisiFUrUBYRHJ5KrKMqiWkLM9olXkQ4TkJqnVEr4Kf7L9ov2TAhSDJ78vVphU3vgxE_a___O5wz91rBlsyudDRPIPHHxfkjfcYcbjLKQRtf41oHDaC9YGd5VT93XDfeakSFi9tftc7xqUgLK9eTuJ2ZRizvFYC4vLTlTeQTf3p9mSha51tEdAxJY9Et0EfnKa-ENmNwUcZ1SmdqACpEiFc8YM8CyUgmXV4xR_8vgRvmtyN4EJkj69gp65taPUwDT_PXKTjxdbZd4KGh3un9g5yoWX6T11ZtlJInlawOd1V3KQ0sMCdvlquMO7HtYUK7ymmfTFU_EAwrzpOr7OTR_oX-JU3Z5Ce_RfvEVFTejzOutXRh7nGQtpkEYRZQM9PG-1IPRVSNsDLUllCWrr8u2dWzA6j09RUlscs0fKUN_YxfUHpvRyhMkJ9InVvs46XzvWYzSBKRa4eeqLAsYVkYgsAsPyVg-JtPRPQnyehIkO_u9_7P7SEcJpPVuw1lNxHzLy78enDbZR3pn2apIx7dcZm4_L2ftCIskSL-piOGMMB99140evL7sA2zmKwMoadGeYFCD0-Dl6IhcF5bv35OeuOqEQUnOXjAoaEGlZFVxVLnx_m80]--></g></svg>